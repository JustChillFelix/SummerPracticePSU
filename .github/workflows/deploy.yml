name: Deploy to Render

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./ExpenseTrackerAPI

    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Setup Node.js
      uses: actions/setup-node@v3
      with:
        node-version: '20' 

    - name: Install dependencies
      run: npm ci

    - name: Build project
      run: npm run build

  deploy:
    needs: build-and-test
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./ExpenseTrackerAPI 

    steps:
    - name: Checkout code 
      uses: actions/checkout@v3

    - name: Trigger Render Deploy
      run: curl "${{ secrets.RENDER_DEPLOY_HOOK }}"